name: Build testv01

on:
  push:
    tags:
      - testv01

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod download
      - run: go build ./...
      - run: CGO_ENABLED=0 go test ./...
